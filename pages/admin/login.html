<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrador · MiTienda</title>
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/admin-login.css">
</head>
<body>

    <main class="login-page">

        <form id="form-login" class="login-card">

            <h1>🏪 Panel administrativo</h1>
            <p>Ingresa con tu correo y contraseña.</p>

            <label for="correo">Correo</label>
            <input type="email" id="correo" required autocomplete="username">

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" required autocomplete="current-password">

            <div id="login-error" class="login-error" style="display:none;"></div>

            <button type="submit" class="btn btn-primary btn-full" id="btn-login">
                Ingresar →
            </button>

            <a href="../recuperar.html" class="volver-login">
                ¿Olvidaste tu contraseña?
            </a>

            <a href="../../index.html" class="volver-login">
                ← Volver al inicio
            </a>

        </form>

    </main>

    <script type="module" src="../../js/admin-login.js"></script>
</body>
</html>

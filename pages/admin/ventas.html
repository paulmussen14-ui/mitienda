<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas · Panel admin · MiTienda</title>
    <link rel="stylesheet" href="../../css/shared/theme.css">
    <link rel="stylesheet" href="../../css/admin/admin.css">
</head>
<body>

    <header class="navbar">
        <div class="brand"><h2 id="admin-nombre-negocio">🏪 Panel</h2></div>

        <nav class="navtabs">
            <a href="index.html">Inicio</a>
            <a href="productos.html">📦 Productos</a>
            <a href="pedidos.html">🧾 Pedidos</a>
            <a href="inventario.html">📊 Inventario</a>
            <a class="active" href="ventas.html">💰 Ventas</a>
            <a href="usuarios.html">👥 Usuarios</a>
        </nav>

        <button id="btn-cerrar-sesion" class="btn btn-primary">Cerrar sesión</button>
    </header>

    <main class="page">

        <div id="admin-cargando">Verificando sesión...</div>

        <div id="admin-contenido" style="display:none;">

            <h1>Ventas</h1>

            <!-- ========================================
                 RESUMEN
            ========================================= -->

            <div class="grid-tiendas" id="resumen-ventas">

                <div class="tienda-card">
                    <div class="tienda-info">
                        <span>Ventas totales</span>
                        <h3 id="resumen-cantidad">0</h3>
                    </div>
                </div>

                <div class="tienda-card">
                    <div class="tienda-info">
                        <span>Ingresos totales</span>
                        <h3 id="resumen-total">S/ 0.00</h3>
                    </div>
                </div>

                <div class="tienda-card">
                    <div class="tienda-info">
                        <span>Ticket promedio</span>
                        <h3 id="resumen-promedio">S/ 0.00</h3>
                    </div>
                </div>

            </div>


            <!-- ========================================
                 FILTRO DE FECHA
            ========================================= -->

            <div class="carrito-section-header" style="margin-top:28px;">
                <h2>Historial</h2>

                <div class="chiprow" id="filtro-fechas">
                    <button type="button" class="chip on" data-rango="todos">Todo</button>
                    <button type="button" class="chip" data-rango="hoy">Hoy</button>
                    <button type="button" class="chip" data-rango="semana">Últimos 7 días</button>
                    <button type="button" class="chip" data-rango="mes">Últimos 30 días</button>
                </div>
            </div>

            <div id="ventas-cargando">Cargando ventas...</div>

            <table id="tabla-ventas" class="admin-tabla" style="display:none;">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Productos</th>
                        <th>Total</th>
                        <th>Pedido</th>
                    </tr>
                </thead>
                <tbody id="lista-ventas"></tbody>
            </table>

            <div id="sin-ventas" style="display:none;">
                <p>No hay ventas registradas en este período.</p>
            </div>

        </div>

    </main>

    <script type="module" src="../../js/admin/admin-ventas.js"></script>
</body>
</html>

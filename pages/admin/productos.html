<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos · Panel admin · MiTienda</title>
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

    <header class="navbar">
        <div class="brand"><h2 id="admin-nombre-negocio">🏪 Panel</h2></div>

        <nav class="navtabs">
            <a href="index.html">Inicio</a>
            <a class="active" href="productos.html">📦 Productos</a>
            <a href="pedidos.html">🧾 Pedidos</a>
            <a href="inventario.html">📊 Inventario</a>
            <a href="ventas.html">💰 Ventas</a>
            <a href="usuarios.html">👥 Usuarios</a>
        </nav>

        <button id="btn-cerrar-sesion" class="btn btn-primary">Cerrar sesión</button>
    </header>

    <main class="page">

        <div id="admin-cargando">Verificando sesión...</div>

        <div id="admin-contenido" style="display:none;">

            <div class="carrito-section-header">
                <h1>Productos</h1>
                <button id="btn-nuevo-producto" class="btn btn-accent">+ Nuevo producto</button>
            </div>

            <div id="productos-cargando">Cargando productos...</div>

            <table id="tabla-productos" class="admin-tabla" style="display:none;">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="lista-productos-admin"></tbody>
            </table>

            <div id="sin-productos" style="display:none;">
                <p>Todavía no tienes productos. Crea el primero.</p>
            </div>

        </div>

    </main>


    <!-- =====================================================
         MODAL PRODUCTO (crear / editar)
    ====================================================== -->

    <div id="modal-producto" class="admin-modal" style="display:none;">

        <form id="form-producto" class="admin-modal-card">

            <h2 id="modal-titulo">Nuevo producto</h2>

            <input type="hidden" id="producto-id">

            <label for="producto-nombre">Nombre</label>
            <input type="text" id="producto-nombre" required>

            <label for="producto-categoria">Categoría</label>
            <select id="producto-categoria">
                <option value="abarrotes">🍚 Abarrotes</option>
                <option value="bebidas">🥤 Bebidas</option>
                <option value="snacks">🍪 Snacks</option>
                <option value="limpieza">🧴 Limpieza</option>
            </select>

            <label for="producto-precio">Precio (S/)</label>
            <input type="number" id="producto-precio" min="0" step="0.10" required>

            <label for="producto-stock">Stock</label>
            <input type="number" id="producto-stock" min="0" step="1" required>

            <label for="producto-descripcion">Descripción</label>
            <textarea id="producto-descripcion" rows="2"></textarea>

            <label for="producto-imagen">URL de imagen (opcional)</label>
            <input type="text" id="producto-imagen">

            <div id="producto-error" class="login-error" style="display:none;"></div>

            <div class="admin-modal-botones">
                <button type="button" id="btn-cancelar-producto" class="btn">Cancelar</button>
                <button type="submit" id="btn-guardar-producto" class="btn btn-primary">Guardar</button>
            </div>

        </form>

    </div>


    <script type="module" src="../../js/admin-productos.js"></script>
</body>
</html>

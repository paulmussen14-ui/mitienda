<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña · MiTienda</title>

    <link rel="stylesheet" href="../../css/shared/theme.css">
    <link rel="stylesheet" href="../../css/cliente/recuperar.css">
</head>
<body>

    <main class="login-page">

        <form id="form-recuperar" class="login-card">

            <h1>🔑 Recuperar contraseña</h1>
            <p>Ingresa el correo de tu cuenta y te enviaremos un enlace para restablecerla.</p>

            <label for="correo">Correo</label>
            <input type="email" id="correo" required autocomplete="username">

            <div id="recuperar-error" class="login-error" style="display:none;"></div>
            <div id="recuperar-exito" class="login-exito" style="display:none;"></div>

            <button type="submit" class="btn btn-primary btn-full" id="btn-recuperar">
                Enviar enlace →
            </button>

            <a href="../admin/login.html" class="volver-login">
                ← Volver a iniciar sesión
            </a>

        </form>

    </main>

    <script type="module" src="../../js/cliente/recuperar.js"></script>
</body>
</html>

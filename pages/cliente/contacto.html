<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto · MiTienda</title>

    <link rel="stylesheet" href="../../css/shared/theme.css">
    <link rel="stylesheet" href="../../css/shared/footer.css">
    <link rel="stylesheet" href="../../css/cliente/contacto.css">

</head>

<body>

    <header class="navbar">

        <div class="navbar-brand">
            <a href="../../index.html">
                🛒 MiTienda
            </a>
        </div>

        <nav class="navtabs">

            <a href="../../index.html">
                Inicio
            </a>

            <a id="nav-productos" href="#">
                Productos
            </a>

            <a id="nav-carrito" href="#">
                Carrito
            </a>

            <a id="nav-pedidos" href="#">
                Pedidos
            </a>

            <a class="active" id="nav-contacto" href="#">
                Contacto
            </a>

        </nav>

    </header>


    <main class="page">

        <section class="contacto-hero">

            <span class="tag">
                ✉️ CONTACTO
            </span>

            <h1 id="nombre-negocio">
                Cargando tienda...
            </h1>

            <p>
                ¿Tienes una consulta, un pedido especial
                o un reclamo? Escríbenos y te responderemos
                lo antes posible.
            </p>

        </section>


        <section class="contacto-formulario">

            <form id="form-contacto">

                <label for="contacto-nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="contacto-nombre"
                    required
                    placeholder="Tu nombre"
                >


                <label for="contacto-email">
                    Correo o teléfono
                </label>

                <input
                    type="text"
                    id="contacto-email"
                    required
                    placeholder="¿Cómo te contactamos?"
                >


                <label for="contacto-tipo">
                    Motivo
                </label>

                <select id="contacto-tipo">
                    <option value="consulta">💬 Consulta</option>
                    <option value="pedido">📦 Sobre un pedido</option>
                    <option value="reclamo">⚠️ Reclamo</option>
                    <option value="otro">✏️ Otro</option>
                </select>


                <label for="contacto-mensaje">
                    Mensaje
                </label>

                <textarea
                    id="contacto-mensaje"
                    rows="5"
                    required
                    placeholder="Cuéntanos qué necesitas..."
                ></textarea>


                <div
                    id="contacto-error"
                    class="login-error"
                    style="display:none;"
                ></div>


                <button
                    type="submit"
                    id="btn-enviar-contacto"
                    class="btn btn-accent"
                >
                    Enviar mensaje
                </button>

            </form>


            <div id="contacto-exito" style="display:none;">

                <h2>
                    ✅ ¡Mensaje enviado!
                </h2>

                <p>
                    Gracias por escribirnos, te responderemos
                    lo antes posible.
                </p>

            </div>

        </section>

    </main>


    <footer id="footer-mitienda" class="site-footer"></footer>


    <script
        type="module"
        src="../../js/cliente/contacto.js"
    ></script>

    <script
        type="module"
        src="../../js/services/footer.js"
    ></script>

</body>

</html>
